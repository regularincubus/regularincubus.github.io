<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klick-Ton</title>
  <style>
    body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
    img  { max-width: 90vw; max-height: 90vh; cursor: pointer; }
  </style>
</head>
<body>

<!-- foto-->
  <img src="chasca_icon.png" alt="Click me!" onclick="play()">

  <script>
    // Audiodateien anpassen
    var anzahl = 1000;

    function play() {
      var nummer = Math.floor(Math.random() * anzahl) + 1;
      new Audio("audio/chasca (" + nummer + ").mp3").play();
    }
  </script>

</body>
</html>
